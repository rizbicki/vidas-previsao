<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>vidas-forecast — página provisória</title>
<style>
:root { color-scheme: light; --page: #ffffff; --surface: #ffffff; --text: #0b0b0b; --muted: #52514e;
  --border: rgba(11,11,11,0.14); --accent: #2a78d6; --error: #b3261e; }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--page); color: var(--text);
  font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
form { width: min(380px, calc(100vw - 32px)); background: var(--surface); border: 1px solid var(--border);
  border-radius: 12px; padding: 24px; }
h1 { font-size: 18px; font-weight: 600; margin: 0 0 4px; }
p { margin: 0 0 16px; color: var(--muted); font-size: 14px; }
label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 4px; }
input[type=password] { width: 100%; font: inherit; color: var(--text); background: var(--page);
  border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; }
input[type=password]:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
.row { display: flex; align-items: center; gap: 8px; margin: 12px 0 16px; font-size: 13px; color: var(--muted); }
.row label { margin: 0; }
button { font: inherit; font-weight: 600; color: #fff; background: var(--accent); border: 0; border-radius: 8px;
  padding: 8px 16px; cursor: pointer; width: 100%; }
button:disabled { opacity: 0.6; cursor: progress; }
#msg { min-height: 20px; margin: 12px 0 0; color: var(--error); font-size: 13px; }
</style>
</head>

  <p id="msg" role="alert"></p>
</form>

<script>
"use strict";
const E = JSON.parse(document.getElementById("enc").textContent);
const KEY = "vidas-forecast-senha";
const msg = document.getElementById("msg"), go = document.getElementById("go");
const bytes = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
const store = {
  get() { try { return localStorage.getItem(KEY); } catch (e) { return null; } },
  set(v) { try { localStorage.setItem(KEY, v); } catch (e) {} },
  drop() { try { localStorage.removeItem(KEY); } catch (e) {} },
};
async function decrypt(pw) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({name: "PBKDF2", salt: bytes(E.salt), iterations: E.iter, hash: "SHA-256"},
    base, {name: "AES-GCM", length: 256}, false, ["decrypt"]);
  const plain = await crypto.subtle.decrypt({name: "AES-GCM", iv: bytes(E.iv)}, key, bytes(E.ct));
  return new TextDecoder().decode(plain);
}
function show(html) { document.open(); document.write(html); document.close(); }
if (!(window.crypto && crypto.subtle)) {
  msg.textContent = "Este navegador não consegue abrir a página. Use um navegador atualizado e o endereço com https.";
  go.disabled = true;
} else {
  const saved = store.get();
  if (saved) decrypt(saved).then(show).catch(() => store.drop());
}
document.getElementById("f").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const pw = document.getElementById("pw").value.trim();
  go.disabled = true; msg.textContent = "";
  try {
    const html = await decrypt(pw);
    if (document.getElementById("remember").checked) store.set(pw);
    show(html);
  } catch (e) {
    msg.textContent = "Senha incorreta.";
    go.disabled = false;
  }
});
</script>
</body>
